<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Структура сайта уЗубного</title>
<link rel="stylesheet" href="fonts.css">
<style>
/* Карта сайта: одно дерево-таблица на всю ширину (страница, статус, адрес сейчас, адрес после переноса), сворачивание в строке,
   карточка страницы – в боковой шторке. Третья вкладка – меню шапки после переноса. */
:root {
  --bg: #050507;
  --surface: #0e0d12;
  --surface-2: #15131b;
  --line: #29262f;
  --line-soft: #1d1b23;
  --line-strong: #433e4c;
  --fg: #e4e2e8;
  --fg-2: #c9c5d0;
  --muted: #918b9a;
  --faint: #5d5865;
  --violet: #a77bf3;
  --violet-deep: #6b2fa0;
  --orange: #fa812a;
  --red: #ff7a72;
  --display: "Magistral", "Segoe UI", system-ui, sans-serif;
  --body: "Gilroy", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  --r-sm: 6px;
  --r: 10px;
  --r-lg: 14px;
  --step: 20px;
  color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--fg); font: 500 14px/1.45 var(--body); }
.wrap { padding: 18px 24px 48px; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--violet); outline-offset: 2px; }
code { font: 400 12px/1.3 var(--mono); }
svg { display: block; }

/* шапка */
.head { display: grid; grid-template-columns: auto minmax(0, 600px) minmax(220px, 1fr); gap: 12px 20px; align-items: center; }
h1 { font: 700 24px/1 var(--display); text-transform: uppercase; letter-spacing: .03em; margin: 0; white-space: nowrap; }
.seg, .chips, .tools { display: grid; gap: 6px; padding: 4px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); }
.seg { grid-template-columns: repeat(3, 1fr); }
.chips { grid-template-columns: repeat(6, 1fr); }
.tools { grid-template-columns: repeat(2, 1fr); }
.btn { display: flex; align-items: center; justify-content: center; gap: 8px; min-width: 0; padding: 8px 10px; border: 1px solid transparent; border-radius: var(--r-sm);
       background: transparent; cursor: pointer; font: 600 12.5px/1.1 var(--body); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.btn:hover { background: var(--surface-2); }
.btn[aria-pressed="true"], .btn[aria-selected="true"] { background: var(--surface-2); border-color: var(--line-strong); }
.seg .btn[aria-selected="true"] { background: var(--violet-deep); border-color: var(--violet-deep); color: #fff; }
.btn b { font: 700 13px/1 var(--display); font-variant-numeric: tabular-nums; }
.btn .short { display: none; }
.search { justify-self: end; width: 100%; max-width: 440px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: var(--r);
          background: var(--surface); padding: 0 12px; color: var(--faint); }
.search input { flex: 1; min-width: 0; background: none; border: 0; padding: 10px 0; color: var(--fg); font-weight: 500; }
.search input:focus { outline: none; }
.search:focus-within { border-color: var(--violet); }
.search input::placeholder { color: var(--faint); }

.bar { display: grid; grid-template-columns: 6fr 2fr; gap: 10px; margin: 12px 0 0; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 20px; margin: 12px 0; padding: 0 4px; font-size: 12.5px; color: var(--muted); }
.legend > span { display: inline-flex; align-items: center; gap: 7px; }
.legend b { color: var(--fg-2); font-weight: 600; }

/* метки */
.dot { width: 9px; height: 9px; flex: none; border-radius: 3px; border: 2px solid var(--muted); background: var(--muted); }
.dot.f-moved { border-color: var(--violet); background: var(--violet); }
.dot.f-new { border-color: var(--orange); background: transparent; }
.dot.f-merge { border-color: var(--orange); background: var(--orange); }
.dot.f-removed { border-color: var(--red); background: transparent; }
.dot.f-drop { border-color: var(--red); background: transparent; border-style: dashed; opacity: .8; }
.tag { flex: none; font: 600 10px/1 var(--body); text-transform: uppercase; letter-spacing: .06em; border: 1px solid; border-radius: 999px; padding: 3px 7px; }
.tag.ad { color: var(--orange); border-color: rgba(250,129,42,.45); }
.adm { width: 16px; height: 9px; flex: none; border: 1.5px solid var(--orange); border-radius: 999px; }
.go { flex: none; width: 24px; height: 24px; display: grid; place-items: center; border-radius: var(--r-sm); color: var(--muted); }
.go:hover { background: var(--line); color: var(--violet); }

/* дерево-таблица */
.grid { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); }
.tr { display: grid; grid-template-columns: minmax(300px, 1fr) 128px minmax(0, 1.25fr) minmax(0, 1fr); min-height: 32px; border-top: 1px solid var(--line-soft); }
.thead { position: sticky; top: 0; z-index: 3; min-height: 38px; border-top: 0; border-bottom: 1px solid var(--line); border-radius: var(--r-lg) var(--r-lg) 0 0;
         background: var(--surface-2); font: 600 10.5px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); }
.thead + .tr { border-top: 0; }
.thead .td { overflow: hidden; white-space: nowrap; }
.td { display: flex; align-items: center; gap: 8px; min-width: 0; padding: 0 12px; }
.thead .td:first-child { padding-left: 16px; }
.c-name { padding-left: 6px; gap: 0; }
.ind { align-self: stretch; flex: none; width: calc(var(--d) * var(--step));
       background: repeating-linear-gradient(90deg, transparent 0 13px, var(--line) 13px 14px, transparent 14px var(--step)); }
.tw { width: 28px; height: 28px; flex: none; display: grid; place-items: center; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; }
.tw svg { transition: transform .15s; }
.tw:hover { background: var(--line); color: var(--fg); }
.tw.leaf { visibility: hidden; }
.tr[aria-expanded="false"] .tw svg { transform: rotate(-90deg); }
.nm { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13.5px; }
.tr.parent .nm { font-weight: 700; }
.tr[aria-level="1"] .nm { font: 700 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .05em; }
.tr.folder .nm { color: var(--muted); }
.tr.st-drop .nm, .tr.st-removed .nm { color: var(--muted); text-decoration: line-through; text-decoration-color: rgba(255,122,114,.55); }
.cnt { flex: none; margin-left: 8px; font: 600 11px/1 var(--body); color: var(--muted); background: var(--surface-2); border: 1px solid var(--line); border-radius: 999px; padding: 3px 7px;
       font-variant-numeric: tabular-nums; }
.c-name .tag { margin-left: 8px; }
.c-st { font-size: 12.5px; color: var(--fg-2); }
.url code { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--fg-2); }
.url .none { color: var(--faint); font-size: 12.5px; }
.url .arrow { flex: none; color: var(--muted); font-size: 12px; }
.tr.body { cursor: pointer; }
.tr.body:hover { background: var(--surface-2); }
.tr.body:focus-visible { outline-offset: -2px; }
.tr.sel { background: rgba(167,123,243,.14); }
.tr.sel:hover { background: rgba(167,123,243,.2); }
.tr.dim > .td { opacity: .28; }
.tr.hit { box-shadow: inset 3px 0 0 var(--violet); }
.grid > .tr:last-child { border-radius: 0 0 var(--r-lg) var(--r-lg); }
.empty { margin: 0; padding: 14px 16px; color: var(--muted); font-size: 13px; border-top: 1px solid var(--line-soft); }


/* меню */
.menu { border: 1px solid var(--line); border-radius: var(--r-lg); background: var(--surface); padding: 6px; }
.mbar { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.mtop { position: relative; min-height: 42px; font: 700 12.5px/1.1 var(--display); text-transform: uppercase; letter-spacing: .05em; }
.mtop svg { flex: none; color: var(--muted); }
.mtop[aria-selected="true"] { background: var(--violet-deep); border-color: var(--violet-deep); color: #fff; }
.mtop[aria-selected="true"] svg { color: #fff; }
.mtop.has-hit::after { content: ""; position: absolute; top: 7px; right: 8px; width: 6px; height: 6px; border-radius: 50%; background: var(--violet); }
.mpanel { padding: 14px 10px 6px; }
.mhead { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 14px; color: var(--muted); font-size: 12.5px; }
.mhead code { color: var(--fg-2); }
.mcols { columns: 5 250px; column-gap: 12px; }
.mcols.drop { columns: auto; width: min(340px, 100%); margin-left: calc(var(--i) * (100% + 6px) / 7); }
.mcol { break-inside: avoid; margin: 0 0 12px; padding: 8px; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface-2); }
.mi { display: flex; align-items: center; gap: 8px; width: 100%; padding: 5px 8px 5px calc(8px + var(--l) * 16px); border: 0; border-radius: var(--r-sm); background: none;
      text-align: left; cursor: pointer; font-size: 13px; line-height: 1.3; color: var(--fg-2); }
.mi:hover { background: var(--line); color: #fff; }
.mi.sec { font: 700 13px/1.2 var(--display); text-transform: uppercase; letter-spacing: .04em; color: var(--fg); padding-block: 7px 9px; }
.mi.par { font-weight: 700; color: var(--fg); }
.mi .dot { margin-left: auto; }
.mi.dim { opacity: .28; }
.mi.hit { box-shadow: inset 3px 0 0 var(--violet); color: #fff; }
.mnote { margin: 0 0 8px; color: var(--muted); font-size: 13px; }

/* шторка */
.scrim { position: fixed; inset: 0; z-index: 20; background: rgba(0,0,0,.55); opacity: 0; pointer-events: none; transition: opacity .2s; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; z-index: 21; width: max(50vw, 560px); max-width: 100%; overflow-y: auto; background: var(--surface);
          border-left: 1px solid var(--line); border-radius: var(--r-lg) 0 0 var(--r-lg); box-shadow: -24px 0 48px rgba(0,0,0,.55);
          padding: 16px 22px calc(28px + env(safe-area-inset-bottom, 0px)); transform: translateX(105%); transition: transform .22s ease; visibility: hidden; }
.drawer.open { transform: none; visibility: visible; }
.d-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
.d-st { display: inline-flex; align-items: center; gap: 8px; font: 600 11px/1 var(--body); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.x { width: 34px; height: 34px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: var(--r); background: none; color: var(--muted); cursor: pointer; }
.x:hover { color: var(--fg); border-color: var(--line-strong); }
.drawer h2 { font: 700 20px/1.15 var(--display); text-transform: uppercase; letter-spacing: .02em; margin: 0 0 14px; text-wrap: balance; }
.fate { padding: 12px 14px; border-radius: var(--r); background: var(--surface-2); margin-bottom: 16px; }
.fate strong { display: block; font-size: 14.5px; margin-bottom: 3px; }
.fate span { color: var(--muted); font-size: 13px; }
.kv { margin-bottom: 14px; }
.kv .k { display: block; font: 600 10.5px/1 var(--body); letter-spacing: .14em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
.kv .v { display: flex; gap: 6px; align-items: flex-start; }
.kv .v code { flex: 1; min-width: 0; white-space: nowrap; overflow-x: auto; scrollbar-width: thin; padding: 8px 10px; border-radius: var(--r-sm); background: var(--surface-2); color: var(--fg-2); }
.kv .go, .copy { width: 32px; height: 32px; }
.copy { flex: none; display: grid; place-items: center; border: 0; border-radius: var(--r-sm); background: none; color: var(--muted); cursor: pointer; }
.copy:hover { background: var(--line); color: var(--violet); }
.copy.ok { color: var(--violet); }
.kv .txt { font-size: 13.5px; color: var(--fg-2); }
.list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.list li { display: flex; align-items: center; gap: 6px; }
.list code { flex: 1; min-width: 0; white-space: nowrap; overflow-x: auto; scrollbar-width: thin; color: var(--muted); }

@media (max-width: 1180px) {
  .head { grid-template-columns: auto minmax(0, 1fr); }
  .search { grid-column: 1 / -1; justify-self: stretch; max-width: none; }
  .bar { grid-template-columns: minmax(0, 1fr) !important; }
}
@media (max-width: 900px) {
  .wrap { padding-inline: 16px; }
  .head { grid-template-columns: minmax(0, 1fr); }
  .tr { grid-template-columns: minmax(0, 1fr) 118px; }
  .c-now, .c-after { display: none !important; }
  .mbar { grid-template-columns: repeat(4, 1fr); }
  .mcols.drop { margin-left: 0; }
}
@media (max-width: 600px) {
  h1 { font-size: 20px; }
  .btn .opt { display: none; }
  .btn .short { display: inline; }
  .chips { grid-template-columns: repeat(2, 1fr) !important; }
  .tr { grid-template-columns: minmax(0, 1fr) 30px; }
  .thead .td:nth-child(2) { visibility: hidden; }
  .c-st { padding: 0 10px; }
  .c-st .lbl { display: none; }
  .mbar { grid-template-columns: repeat(2, 1fr); }
  :root { --step: 14px; }
  .ind { background: repeating-linear-gradient(90deg, transparent 0 10px, var(--line) 10px 11px, transparent 11px var(--step)); }
  .drawer { border-radius: 0; padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) { .tw svg, .drawer, .scrim { transition: none; } }
</style>

<div class="wrap" id="wrap">
  <header class="head">
    <h1>Структура сайта уЗубного</h1>
    <div class="seg" role="tablist" aria-label="Что показать">
      <button class="btn" type="button" role="tab" data-view="future" aria-selected="true"><span>Будущая<span class="opt"> структура</span></span></button>
      <button class="btn" type="button" role="tab" data-view="current" aria-selected="false"><span>Текущая<span class="opt"> структура</span></span></button>
      <button class="btn" type="button" role="tab" data-view="menu" aria-selected="false"><span class="opt">Структура меню</span><span class="short">Меню</span></button>
    </div>
    <label class="search">
      <svg width="15" height="15" viewBox="0 0 16 16" aria-hidden="true"><circle cx="7" cy="7" r="5" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="m11 11 3.5 3.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      <input id="q" type="search" placeholder="Найти страницу или адрес" aria-label="Поиск">
    </label>
  </header>

  <div class="bar" id="bar">
    <div class="chips" id="chips" role="group" aria-label="Подсветить"></div>
    <div class="tools">
      <button class="btn" type="button" id="t-open">Развернуть всё</button>
      <button class="btn" type="button" id="t-close">Свернуть всё</button>
    </div>
  </div>
  <p class="legend" id="legend"></p>

  <main id="canvas" aria-live="polite"></main>
</div>

<div class="scrim" id="scrim"></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="d-title" inert>
  <div class="d-top">
    <span class="d-st" id="d-st"></span>
    <button class="x" type="button" id="d-close" aria-label="Закрыть">
      <svg width="14" height="14" viewBox="0 0 14 14" aria-hidden="true"><path d="M2 2l10 10M12 2 2 12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
    </button>
  </div>
  <h2 id="d-title"></h2>
  <div id="d-body"></div>
</aside>

<script src="data.js"></script>
<script>
(function () {
  const D = window.SITE || { nodes: [], current: [], menu: [] };
  const HOST = 'https://стоматология-петербург.рф';
  const ALIAS = {
    'Лечение зубов в рассрочку': 'Рассрочка',
    'Стоматология, в которой заботятся о вас на каждом этапе лечения': 'О клинике',
    'Полезные статьи и новости нашей клиники': 'Блог',
    'Контакты и адрес': 'Контакты',
    'Отзывы наших пациентов': 'Отзывы',
    'Популярные вопросы и ответы': 'Вопросы и ответы',
    'Видео отзывы стоматологии “уЗубного”': 'Видеоотзывы',
    'Примеры работ в стоматологии "уЗубного"': 'Примеры работ',
    'Стоматология у метро Лиговский проспект': 'У метро «Лиговский проспект»',
    'Стоматология у метро Обводный канал': 'У метро «Обводный канал»'
  };
  const label = n => ALIAS[n.name] || n.name;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const plural = (n, f) => f[(n % 10 === 1 && n % 100 !== 11) ? 0 : (n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20)) ? 1 : 2];
  const ICON = {
    out: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="M9.5 2.5h4v4M13.5 2.5 7.5 8.5M12 9.5V13a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h3.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    copy: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><rect x="5.5" y="5.5" width="8" height="8" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M10.5 3.5v-.5a1 1 0 0 0-1-1H3.5a1 1 0 0 0-1 1v6a1 1 0 0 0 1 1h.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>',
    ok: '<svg width="14" height="14" viewBox="0 0 16 16" aria-hidden="true"><path d="m3 8.5 3 3 7-7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    chev: '<svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true"><path d="M2 3.5 5 6.5 8 3.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>'
  };
  const go = (path, name) => `<a class="go" href="${esc(HOST + path)}" target="_blank" rel="noopener" title="Открыть на сайте в новой вкладке" aria-label="Открыть «${esc(name || path)}» на сайте в новой вкладке">${ICON.out}</a>`;

  const ST = {
    same: 'Остаётся', moved: 'Переезжает', new: 'Новая', drop: 'Не создаём', merge: 'Склеивается', removed: 'Удаляется'
  };
  const CHIP = { same: 'Остаются', moved: 'Переезжают', new: 'Новые', drop: 'Не создаём', merge: 'Склеиваются', removed: 'Удаляются' };
  const VIEWS = {
    future: { key: 'status', items: () => D.nodes, chips: ['same', 'moved', 'new', 'drop', 'removed'],
              legend: [['same', 'адрес не меняется'], ['moved', 'новый адрес, со старого 301'], ['new', 'создаём по семантике'],
                       ['drop', 'клиника не оказывает услугу'], ['removed', 'страница есть, услугу не оказываем: 301 на раздел']] },
    current: { key: 'fate', items: () => D.current, chips: ['same', 'moved', 'merge', 'removed'],
               legend: [['same', 'адрес не меняется'], ['moved', 'уходит на новый адрес в разделе'], ['merge', 'дубль, 301 на основную'], ['removed', 'услугу не оказываем, 301 на раздел']] }
  };

  // будущая структура: дерево по родителям
  const byNew = new Map(D.nodes.map(n => [n.new, n]));
  const byName = new Map(D.nodes.map(n => [n.name, n]));
  function futureTree() {
    const kids = {};
    D.nodes.forEach(n => { (kids[n.parent || ''] = kids[n.parent || ''] || []).push(n); });
    const mk = n => ({ n, label: label(n), kids: (kids[n.name] || []).map(mk) });
    return (kids[''] || []).map(mk);
  }
  // текущая структура: по адресам
  const BLOG = new Set(['braces', 'aligners', 'ortodontija-v-spb', 'protezirovanie-zubov-v-spb', 'protezirovanie-zubov', 'zubnye-protezy',
                        'implantacija-zubov', 'vyravnivanie-zubov', 'stomatologija']);
  function currentTree() {
    const byFolder = {};
    D.current.forEach(c => { (byFolder[c.folder] = byFolder[c.folder] || []).push(c); });
    const sort = a => a.slice().sort((x, y) => label(x).localeCompare(label(y), 'ru'));
    const mk = c => ({ n: c, label: label(c), kids: [] });
    const rootPages = byFolder[''] || [];
    const svc = rootPages.find(c => c.cur === '/service/');
    const main = rootPages.find(c => c.cur === '/');
    const roots = [];
    const tops = sort(rootPages.filter(c => c !== svc && c !== main)).map(mk);
    roots.push(main ? { n: main, label: 'Главная', kids: tops } : { label: 'Корень сайта', kids: tops });
    if (svc) roots.push({ n: svc, label: 'Услуги', kids: sort(byFolder.service || []).map(mk) });
    Object.keys(byFolder).filter(f => f && f !== 'service' && !BLOG.has(f))
      .forEach(f => roots.push({ label: '/' + f + '/', kids: sort(byFolder[f]).map(mk) }));
    const blog = Object.keys(byFolder).filter(f => BLOG.has(f)).sort();
    if (blog.length) roots.push({ label: 'Рубрики блога с посадочными', kids: blog.map(f => ({ label: '/' + f + '/', kids: sort(byFolder[f]).map(mk) })) });
    return roots;
  }

  // где страница в меню
  const menuPath = new Map();
  D.menu.forEach(t => {
    if (t.url) menuPath.set(t.url, [t.name]);
    t.cols.forEach(c => {
      const base = c.name ? [t.name, c.name] : [t.name];
      if (c.url) menuPath.set(c.url, base);
      const stack = [];
      c.items.forEach(it => {
        stack.length = it.lvl;
        stack[it.lvl] = it.name;
        menuPath.set(it.url, base.concat(stack.slice(0, it.lvl + 1)));
      });
    });
  });
  const crumbs = n => { const out = []; let p = n.parent; while (p) { out.unshift(label(byName.get(p) || { name: p })); p = (byName.get(p) || {}).parent; } return out; };

  // состояние
  const $ = id => document.getElementById(id);
  const canvas = $('canvas'), wrap = $('wrap'), drawer = $('drawer'), scrim = $('scrim');
  let view = 'future', filt = 'all', query = '', menuTop = 0;
  let rows = [], rowOf = new Map(), selEl = null, lastFocus = null;
  const closedBy = { future: new Set(), current: new Set() };
  const fateOf = n => n[VIEWS[view].key];

  function flatten(roots) {
    const out = [];
    const walk = (t, depth, parent, path, i) => {
      const r = { t, n: t.n || null, depth, parent, id: path + '/' + i + ':' + t.label, hasKids: t.kids.length > 0, size: 0 };
      const at = out.length;
      out.push(r);
      t.kids.forEach((k, j) => walk(k, depth + 1, r, r.id, j));
      r.size = out.length - at - 1;
    };
    roots.forEach((t, i) => walk(t, 0, null, '', i));
    return out;
  }
  function rowHTML(r) {
    const n = r.n, f = n ? fateOf(n) : '';
    let now = '', after = '';
    if (n) {
      now = n.cur ? `<code title="${esc(n.cur)}">${esc(n.cur)}</code>${go(n.cur, label(n))}` : '<span class="none">страницы нет</span>';
      const to = view === 'future' && f !== 'removed' ? n.new : n.to;
      if (f === 'same') after = '<span class="none">не меняется</span>';
      else if (f === 'drop') after = '<span class="none">не создаём</span>';
      else if (f === 'merge' || f === 'removed') after = `<span class="arrow">301 →</span><code title="${esc(to)}">${esc(to)}</code>`;
      else after = `<code title="${esc(to)}">${esc(to)}</code>`;
    }
    return `<div class="td c-name" role="gridcell"><span class="ind" style="--d:${r.depth}"></span>` +
      `<button class="tw${r.hasKids ? '' : ' leaf'}" type="button" tabindex="-1" aria-hidden="true">${ICON.chev}</button>` +
      `<span class="nm"${n && label(n) !== n.name ? ` title="${esc(n.name)}"` : ''}>${esc(r.t.label)}</span>` +
      (r.hasKids ? `<span class="cnt" title="вложенных страниц">${r.size}</span>` : '') +
      (n && n.ad ? '<span class="tag ad">реклама</span>' : '') + '</div>' +
      `<div class="td c-st" role="gridcell">${n ? `<span class="dot f-${f}"></span><span class="lbl">${ST[f]}</span>` : ''}</div>` +
      `<div class="td c-now url" role="gridcell">${now}</div><div class="td c-after url" role="gridcell">${after}</div>`;
  }

  function renderGrid() {
    rows = flatten(view === 'future' ? futureTree() : currentTree());
    rowOf = new Map();
    const closed = closedBy[view];
    const grid = document.createElement('div');
    grid.className = 'grid';
    grid.setAttribute('role', 'treegrid');
    grid.setAttribute('aria-label', view === 'future' ? 'Будущая структура сайта' : 'Текущая структура сайта');
    grid.innerHTML = '<div class="tr thead" role="row"><div class="td" role="columnheader">Страница</div><div class="td" role="columnheader">Статус</div>' +
      '<div class="td c-now" role="columnheader">Сейчас на сайте</div><div class="td c-after" role="columnheader">После переноса</div></div>';
    rows.forEach((r, i) => {
      const d = document.createElement('div');
      d.className = 'tr body' + (r.hasKids ? ' parent' : '') + (r.n ? ' st-' + fateOf(r.n) : ' folder');
      d.setAttribute('role', 'row');
      d.setAttribute('aria-level', r.depth + 1);
      if (r.hasKids) d.setAttribute('aria-expanded', String(!closed.has(r.id)));
      d.tabIndex = i === 0 ? 0 : -1;
      d.innerHTML = rowHTML(r);
      r.el = d;
      rowOf.set(d, r);
      grid.appendChild(d);
    });
    const empty = document.createElement('p');
    empty.className = 'empty';
    empty.id = 'empty';
    empty.hidden = true;
    empty.textContent = 'Ничего не нашлось.';
    grid.appendChild(empty);
    canvas.innerHTML = '';
    canvas.appendChild(grid);
    grid.addEventListener('click', onGridClick);
    grid.addEventListener('keydown', onGridKey);
    apply();
  }
  function visible() { return rows.filter(r => !r.el.hidden); }
  function refresh() {
    const closed = closedBy[view];
    let cut = Infinity;
    rows.forEach(r => {
      if (r.depth > cut) { r.el.hidden = true; return; }
      cut = Infinity;
      r.el.hidden = false;
      if (r.hasKids && closed.has(r.id)) cut = r.depth;
    });
  }
  function setOpen(r, open) {
    if (!r.hasKids) return;
    if (open) closedBy[view].delete(r.id); else closedBy[view].add(r.id);
    r.el.setAttribute('aria-expanded', String(open));
    refresh();
  }
  function onGridClick(e) {
    const tr = e.target.closest('.tr.body');
    if (!tr || e.target.closest('a')) return;
    const r = rowOf.get(tr);
    focusRow(r);
    if (e.target.closest('.tw') || !r.n) { setOpen(r, closedBy[view].has(r.id)); return; }
    openCard(r.n, view, tr);
  }
  function focusRow(r) {
    rows.forEach(x => { x.el.tabIndex = -1; });
    r.el.tabIndex = 0;
    r.el.focus({ preventScroll: true });
  }
  function onGridKey(e) {
    const tr = e.target.closest('.tr.body');
    if (!tr || e.target !== tr) return;
    const r = rowOf.get(tr), vis = visible(), i = vis.indexOf(r);
    const move = j => { if (vis[j]) { focusRow(vis[j]); vis[j].el.scrollIntoView({ block: 'nearest' }); } };
    if (e.key === 'ArrowDown') move(i + 1);
    else if (e.key === 'ArrowUp') move(i - 1);
    else if (e.key === 'ArrowRight') { if (r.hasKids && closedBy[view].has(r.id)) setOpen(r, true); else move(i + 1); }
    else if (e.key === 'ArrowLeft') { if (r.hasKids && !closedBy[view].has(r.id)) setOpen(r, false); else if (r.parent) { focusRow(r.parent); } }
    else if (e.key === 'Enter' || e.key === ' ') { if (r.n) openCard(r.n, view, tr); else setOpen(r, closedBy[view].has(r.id)); }
    else return;
    e.preventDefault();
  }

  function apply() {
    if (view === 'menu') return applyMenu();
    const q = query.trim().toLowerCase();
    const active = filt !== 'all' || !!q;
    let hits = 0;
    rows.forEach(r => {
      const n = r.n;
      let ok = true;
      if (n) {
        const okF = filt === 'all' || (filt === 'ad' ? n.ad : fateOf(n) === filt);
        const hay = (r.t.label + ' ' + n.name + ' ' + (n.new || '') + ' ' + (n.cur || '') + ' ' + (n.to || '')).toLowerCase();
        ok = okF && (!q || hay.includes(q));
      } else ok = !active;
      r.el.classList.toggle('dim', active && !ok);
      r.el.classList.toggle('hit', !!q && ok && !!n);
      if (active && ok && n) {
        hits++;
        for (let p = r.parent; p; p = p.parent) { closedBy[view].delete(p.id); p.el.setAttribute('aria-expanded', 'true'); }
      }
    });
    refresh();
    const em = $('empty');
    if (em) em.hidden = !(active && !hits);
  }

  // меню шапки
  function renderMenu() {
    canvas.innerHTML = '<div class="menu"><div class="mbar" role="tablist" aria-label="Верхние пункты меню">' +
      D.menu.map((t, i) => `<button class="btn mtop" type="button" role="tab" data-i="${i}" aria-selected="${i === menuTop}">${esc(t.name)}${t.cols.length ? ICON.chev : ''}</button>`).join('') +
      '</div><div class="mpanel" id="mpanel" role="tabpanel"></div></div>';
    canvas.querySelectorAll('.mtop').forEach(b => b.addEventListener('click', () => {
      menuTop = +b.dataset.i;
      canvas.querySelectorAll('.mtop').forEach(x => x.setAttribute('aria-selected', String(x === b)));
      renderPanel();
    }));
    renderPanel();
  }
  function itemBtn(it, cls) {
    const mark = it.status === 'new' ? '<span class="dot f-new" title="страницы ещё нет"></span>' : '';
    return `<button class="mi ${cls} f-${it.status}" type="button" data-url="${esc(it.url)}" style="--l:${it.lvl || 0}">${esc(it.name)}${mark}</button>`;
  }
  function renderPanel() {
    const t = D.menu[menuTop], p = $('mpanel');
    const total = t.cols.reduce((s, c) => s + c.items.length + (c.name ? 1 : 0), 0);
    let h = '<p class="mhead">' + (t.url ? `Пункт «${esc(t.name)}» ведёт на <code>${esc(t.url)}</code>${go(t.url, t.name)}` : `Пункт «${esc(t.name)}» без своей страницы, только раскрывает список`) +
      (total ? ` · ${total} ${plural(total, ['пункт', 'пункта', 'пунктов'])}` : ' · без выпадающего списка') + '</p>';
    if (t.cols.length) {
      h += `<div class="mcols${t.cols.length > 1 ? '' : ' drop'}" style="--i:${menuTop}">` + t.cols.map(c => {
        let s = '<section class="mcol">';
        if (c.name) s += itemBtn({ name: c.name, url: c.url, status: c.status, lvl: 0 }, 'sec');
        c.items.forEach((it, i) => { s += itemBtn(it, c.items[i + 1] && c.items[i + 1].lvl > it.lvl ? 'par' : ''); });
        return s + '</section>';
      }).join('') + '</div>';
    }
    p.innerHTML = h;
    p.querySelectorAll('.mi').forEach(b => b.addEventListener('click', () => { const n = byNew.get(b.dataset.url); if (n) openCard(n, 'future', b); }));
    applyMenu();
  }
  function applyMenu() {
    const q = query.trim().toLowerCase();
    const match = it => it.name.toLowerCase().includes(q) || (it.url || '').toLowerCase().includes(q);
    canvas.querySelectorAll('.mi').forEach(b => {
      const ok = !q || b.textContent.toLowerCase().includes(q) || b.dataset.url.toLowerCase().includes(q);
      b.classList.toggle('dim', !!q && !ok);
      b.classList.toggle('hit', !!q && ok);
    });
    canvas.querySelectorAll('.mtop').forEach(b => {
      const t = D.menu[+b.dataset.i];
      b.classList.toggle('has-hit', !!q && t.cols.some(c => (c.name && match(c)) || c.items.some(match)));
    });
  }

  // шторка
  function kv(k, path, opts) {
    if (!path) return '';
    return `<div class="kv"><span class="k">${k}</span><div class="v"><code>${esc(path)}</code>` +
      (opts.go ? go(path) : '') +
      `<button class="copy" type="button" data-copy="${esc(path)}" title="Скопировать адрес" aria-label="Скопировать адрес">${ICON.copy}</button></div></div>`;
  }
  function openCard(n, mode, src) {
    lastFocus = src;
    if (selEl) selEl.classList.remove('sel');
    selEl = src && src.classList.contains('tr') ? src : null;
    if (selEl) selEl.classList.add('sel');
    const f = mode === 'future' ? n.status : n.fate;
    const T = {
      same: ['Остаётся как есть', n.ad ? 'Посадочная из рекламы: адрес не меняем, страницу не удаляем и не перенаправляем.' : 'Адрес не меняется, страница остаётся на месте.'],
      moved: ['Переезжает на новый адрес', 'Страница уходит в свой раздел. Со старого адреса ставим 301, позиции и ссылки переходят на новый.'],
      new: ['Новая страница', 'Создаём по семантике, на сайте её пока нет.'],
      drop: ['Не создаём', 'Клиника не оказывает эту услугу (ответ клиента 01.10.2026): страницу в структуру не добавляем.'],
      merge: ['Склеивается с основной', `Дубль страницы «${n.to_name || 'основная страница'}»: ставим 301 на основную, полезный текст переносим.`],
      removed: ['Удаляется', 'Клиника не оказывает эту услугу: страницу снимаем, ставим 301 на раздел.']
    }[f];
    $('d-st').innerHTML = `<span class="dot f-${f}"></span>${ST[f]}` + (n.ad ? ' <span class="tag ad">реклама</span>' : '');
    $('d-title').textContent = label(n);
    let h = `<div class="fate"><strong>${T[0]}</strong><span>${esc(T[1])}</span></div>`;
    if (mode === 'future') {
      if (f === 'same') h += kv('Адрес', n.new, { go: true });
      else if (f === 'moved') h += kv('Сейчас на сайте', n.cur, { go: true }) + kv('После переноса', n.new, {});
      else if (f === 'removed') h += kv('Сейчас на сайте', n.cur, { go: true }) + kv('301 на', n.to, {});
      else h += kv('Будущий адрес', n.new, {});
    } else {
      h += kv('Сейчас на сайте', n.cur, { go: true });
      if (f === 'moved') h += kv('После переноса', n.to, {});
      if (f === 'merge' || f === 'removed') h += kv('301 на', n.to, {});
    }
    const fut = mode === 'future' ? n : byNew.get(n.to);
    if (fut && (mode === 'future' || f !== 'removed')) {
      const c = crumbs(fut);
      if (c.length) h += `<div class="kv"><span class="k">${f === 'merge' ? 'Основная страница в разделе' : 'Раздел'}</span><div class="txt">${c.map(esc).join(' → ')}</div></div>`;
      const m = menuPath.get(fut.new);
      if (m) h += `<div class="kv"><span class="k">В меню шапки</span><div class="txt">${m.map(esc).join(' → ')}</div></div>`;
    }
    if (mode === 'future' && n.merges && n.merges.length) {
      h += `<div class="kv"><span class="k">Сюда склеиваются дубли (301)</span><ul class="list">${n.merges.map(u => `<li><code>${esc(u)}</code>${go(u)}</li>`).join('')}</ul></div>`;
    }
    $('d-body').innerHTML = h;
    $('d-body').querySelectorAll('[data-copy]').forEach(b => b.addEventListener('click', () => copy(b)));
    drawer.inert = false;
    wrap.inert = true;
    drawer.classList.add('open');
    scrim.classList.add('open');
    $('d-close').focus();
  }
  function copy(b) {
    const done = () => { b.innerHTML = ICON.ok; b.classList.add('ok'); setTimeout(() => { b.innerHTML = ICON.copy; b.classList.remove('ok'); }, 1400); };
    const fallback = () => {
      const r = document.createRange(); r.selectNodeContents(b.parentElement.querySelector('code'));
      const s = getSelection(); s.removeAllRanges(); s.addRange(r);
    };
    if (navigator.clipboard) navigator.clipboard.writeText(HOST + b.dataset.copy).then(done, fallback); else fallback();
  }
  function closeCard() {
    if (!drawer.classList.contains('open')) return;
    drawer.classList.remove('open');
    scrim.classList.remove('open');
    wrap.inert = false;
    drawer.inert = true;
    if (selEl) selEl.classList.remove('sel');
    selEl = null;
    if (lastFocus && document.contains(lastFocus)) lastFocus.focus({ preventScroll: true });
  }
  $('d-close').addEventListener('click', closeCard);
  scrim.addEventListener('click', closeCard);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') closeCard(); });

  // панель управления
  function render() {
    const isMenu = view === 'menu';
    $('bar').hidden = isMenu;
    $('q').placeholder = isMenu ? 'Найти пункт меню' : 'Найти страницу или адрес';
    if (isMenu) {
      $('legend').innerHTML = '<span>Заголовок колонки ведёт на страницу раздела</span><span><span class="dot f-new"></span><b>Страницы ещё нет</b> пункт появится после её создания</span>';
      renderMenu();
      return;
    }
    const V = VIEWS[view], items = V.items();
    const chips = [['all', 'Все', items.length]].concat(V.chips.map(k => [k, CHIP[k], items.filter(n => fateOf(n) === k).length]),
                                                          [['ad', 'Реклама', items.filter(n => n.ad).length]]);
    $('chips').style.gridTemplateColumns = `repeat(${chips.length}, 1fr)`;
    $('bar').style.gridTemplateColumns = `${chips.length}fr 2fr`;
    $('chips').innerHTML = chips.map(([k, t, c]) => `<button class="btn" type="button" data-f="${k}" aria-pressed="${filt === k}">` +
      (k === 'all' ? '' : k === 'ad' ? '<span class="adm"></span>' : `<span class="dot f-${k}"></span>`) + `${t} <b>${c}</b></button>`).join('');
    $('chips').querySelectorAll('[data-f]').forEach(b => b.addEventListener('click', () => {
      filt = filt === b.dataset.f ? 'all' : b.dataset.f;
      $('chips').querySelectorAll('[data-f]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.f === filt)));
      apply();
    }));
    $('legend').innerHTML = V.legend.map(([k, d]) => `<span><span class="dot f-${k}"></span><b>${ST[k]}</b> ${d}</span>`).join('') +
      '<span><span class="tag ad">реклама</span> посадочная из рекламы, адрес не меняем</span>';
    renderGrid();
  }
  document.querySelectorAll('[data-view]').forEach(b => b.addEventListener('click', () => {
    if (view === b.dataset.view) return;
    view = b.dataset.view;
    filt = 'all';
    document.querySelectorAll('[data-view]').forEach(x => x.setAttribute('aria-selected', String(x === b)));
    render();
  }));
  $('q').addEventListener('input', e => { query = e.target.value; apply(); });
  $('t-open').addEventListener('click', () => { closedBy[view].clear(); rows.forEach(r => r.hasKids && r.el.setAttribute('aria-expanded', 'true')); refresh(); });
  $('t-close').addEventListener('click', () => {
    rows.forEach(r => {
      if (r.hasKids) { closedBy[view].add(r.id); r.el.setAttribute('aria-expanded', 'false'); }
    });
    refresh();
  });
  render();
})();
</script>

</html>
