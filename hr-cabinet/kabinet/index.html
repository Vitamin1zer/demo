<div class="doc">
  <div class="notice">Это каркас для обсуждения, не рабочая система: все люди, цифры и события вымышлены. Каждый экран показывает, какие данные и в каком виде должны появиться в кабинете. Исходное ТЗ — базовая версия от 11.10.2026.</div>

  <h2>Что уже есть в каркасе</h2>
  <ul>
    <li><b>Кабинет сотрудника:</b> профиль с грейдом и стажем, оперативные задачи из 1:1 и длительные из PR/ИПР, курсы LMS, итоги PR и 360, матрица компетенций с зонами роста, ИПР по модели 70-20-10, протоколы 1:1.</li>
    <li><b>Кабинет руководителя:</b> дашборд с KPI агентства, оргструктура, список сотрудников с фильтрами, профиль подчинённого с 7 вкладками и приватной заметкой, Performance Review с 9-box и шагами цикла, адаптация 30/60/90 и обязательные курсы, пульс-опросы с тепловой картой и eNPS, журнал обратной связи, воронка найма, карта процессов и источников данных.</li>
  </ul>

  <h2>Предложения к ТЗ</h2>
  <p>Что добавить или уточнить по сравнению с базовой версией. Основано на практике Lattice, Leapsome, 15Five, Culture Amp, iSpring Learn, StartExam, «Поток» и рекомендациях Gallup.</p>
  <ol>
    <li><b>Матрица компетенций — единый источник.</b> Один набор компетенций по треку с ожиданиями на каждом грейде; от него считаются ИПР, 360, PR и «зоны роста». Сейчас в ТЗ это три разных артефакта.</li>
    <li><b>1:1 как рабочий инструмент, а не запись.</b> Общая повестка (оба добавляют пункты), action items с владельцем и сроком, перенос неразобранного, напоминание перед встречей, контекстная панель (цели, ИПР, последний фидбек). Оперативные задачи сотрудника рождаются именно здесь.</li>
    <li><b>Приватные заметки руководителя — отдельный контур.</b> Видит только автор, не попадают в экспорт, отчёты и ИИ-функции; по 152-ФЗ сотрудник вправе запросить свои персональные данные, поэтому нужна процедура выдачи и срок хранения.</li>
    <li><b>Порог анонимности в 360 и пульс-опросах.</b> Результаты группы показывать от 5 ответов (для коллег в 360 — от 3), с защитой от «вычитания» подгрупп. В агентстве с отделами по 3–4 человека без этого анонимности нет.</li>
    <li><b>Performance Review раз в полгода с калибровкой.</b> Самооценка → 360 → оценка руководителя → калибровка между руководителями отделов → итоги. Между циклами — прогресс-ревью без оценки. Критерии результативности и потенциала фиксировать до начала цикла.</li>
    <li><b>ИПР по модели 70-20-10.</b> 3–5 целей, у каждой — компетенция, уровень «было → цель», шаги трёх типов (практика, наставник, курс), ежемесячный чекин на 1:1 и квартальный обзор. Курс из ИПР назначается в LMS автоматически.</li>
    <li><b>Онбординг с письменными критериями 30/60/90.</b> Владелец — руководитель, не HR; у новичка бадди; метрики: выполнение чекпоинтов, time-to-productivity, удержание 90 дней. Риск по новичку считается автоматически.</li>
    <li><b>Пульс-опрос: 5–7 вопросов раз в месяц + блок «что сделали по итогам».</b> Отклик падает, когда ничего не меняется; «закрытие петли» должны видеть все сотрудники.</li>
    <li><b>Набор KPI дашборда зафиксировать в ТЗ.</b> Headcount и движение, текучесть (добровольная/сожалеемая), eNPS и вовлечённость по отделам, регулярность 1:1, доля закрытых целей и просрочек, прогресс ИПР и обязательных курсов, распределение по грейдам, прогресс испытательных сроков, воронка найма.</li>
    <li><b>Записи встреч и транскрипты — как источник, а не как хранилище.</b> Из транскрипта извлекаются договорённости и задачи, руководитель подтверждает, и только тогда они попадают в протокол. Сами видео — по ссылке на внешнее хранилище, со сроком жизни.</li>
    <li><b>Еженедельный чек-ин сотрудника (2 минуты):</b> приоритеты недели, блокеры, самочувствие. Даёт руководителю сигнал между 1:1 и делает дашборд живым без ручного ввода.</li>
    <li><b>Роли и видимость прописать явно:</b> сотрудник, руководитель отдела, руководитель агентства, HR/администратор; кто видит оценки, 360, заметки, историю грейдов и связь с деньгами.</li>
  </ol>

  <h2>Вопросы, без ответов на которые систему не спроектировать</h2>
  <div class="q"><b>1. Кто пользователи и сколько их?</b><small>Число сотрудников и отделов, есть ли HR-менеджер или руководители ведут всё сами, нужен ли доступ директору ко всем отделам.</small></div>
  <div class="q"><b>2. Роли и видимость.</b><small>Кто видит оценки, 360, приватные заметки, грейды и их связь с зарплатой: только прямой руководитель, вся цепочка, HR, директор?</small></div>
  <div class="q"><b>3. Есть ли модель компетенций и грейдов?</b><small>Сколько треков (SEO, контекст, дизайн, разработка, аккаунтинг…), готовы ли шаблоны матриц по каждому, одинаковая ли шкала грейдов.</small></div>
  <div class="q"><b>4. Какая LMS и что из неё нужно?</b><small>Название платформы, есть ли API, какие данные тянем: назначения, прогресс, баллы тестов, сертификаты.</small></div>
  <div class="q"><b>5. Откуда берутся задачи?</b><small>Есть ли трекер (Kaiten, Jira, Битрикс24, Asana) и нужна ли двусторонняя синхронизация, или задачи фиксируются только в протоколах 1:1.</small></div>
  <div class="q"><b>6. Частота и формат оценок.</b><small>PR раз в квартал, полгода или год; шкала (1–5, «ниже/соответствует/выше»); нужна ли калибровка между отделами; влияет ли оценка на зарплату и бонусы.</small></div>
  <div class="q"><b>7. Анонимность.</b><small>360 и пульс анонимны или конфиденциальны; устраивает ли порог «от 5 ответов» при отделах из 3–4 человек; показывать ли сотруднику его 360 целиком или в агрегате.</small></div>
  <div class="q"><b>8. Записи встреч и транскрипты.</b><small>Где лежат сейчас (Zoom, Google Meet, Яндекс Телемост, ktalk), в каком формате транскрипты, нужно ли автоматическое извлечение задач, кто подтверждает.</small></div>
  <div class="q"><b>9. Где хранятся данные и кто оператор ПДн.</b><small>Свой сервер в РФ или облако; требуется ли on-premise; согласия сотрудников на обработку; сроки хранения оценок и заметок.</small></div>
  <div class="q"><b>10. Источник оргструктуры и кадровых данных.</b><small>1С ЗУП, Битрикс24, таблица; кто заводит сотрудника, меняет грейд и руководителя; нужна ли история изменений.</small></div>
  <div class="q"><b>11. Найм: нужен ли модуль или интеграция с ATS?</b><small>Хантфлоу, Talantix, таблица; что из этапов собеседование → тестовое → финал должно жить в кабинете.</small></div>
  <div class="q"><b>12. Что считать «результатом» в агентстве?</b><small>Единые метрики продуктивности для дашборда: проекты на человека, выполнение планов по клиентам, часы, выручка — без этого KPI сотрудника не определить.</small></div>
  <div class="q"><b>13. Пульс-опросы.</b><small>Частота, набор вопросов, ведёт ли кто-то обратную связь по итогам, нужны ли уведомления в мессенджер.</small></div>
  <div class="q"><b>14. Технические рамки.</b><small>Веб только или мобильная версия; вход по корпоративному аккаунту (Google, Яндекс, AD); бюджет и срок; готовая платформа (StartExam, iSpring, Поток, Mirapolis) или своя разработка.</small></div>

  <h2>Что ещё можно показать в следующей версии каркаса</h2>
  <ul>
    <li>Форма анкеты обратной связи и форма самооценки по матрице.</li>
    <li>Экран еженедельного чек-ина сотрудника.</li>
    <li>Экран HR/администратора: настройка цикла PR, шаблоны матриц, опросов и планов адаптации.</li>
    <li>Уведомления: что приходит сотруднику и руководителю и когда.</li>
    <li>Экспорт отчётов по отделу для директора.</li>
  </ul>
