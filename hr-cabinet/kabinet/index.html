<div class="doc">
  <div class="notice">Каркас для обсуждения, не рабочая система: люди, цифры и события вымышлены. Экраны собраны по вкладке «3.0. Задача» и по действующим артефактам агентства: личный кабинет сотрудника в таблице и журнал обратной связи по кварталам.</div>

  <h2>Как смотреть</h2>
  <p>Тёмная полоса сверху управляет демонстрацией и в продукт не входит. В ней переключаются роль, вариант дизайна и тема, а справа открываются документы.</p>
  <ul>
    <li><b>А · Artsofte.</b> Фирменный стиль агентства: левое меню, серые карточки со скруглением, синий акцент и оранжевая кнопка действия.</li>
    <li><b>Б · Воздух.</b> Меню сверху, белые карточки с тонкой рамкой, больше свободного места, чёрная кнопка действия. Под тех, кто открывает кабинет пару раз в неделю.</li>
    <li><b>В · Плотный.</b> Рабочая консоль: тёмное меню, компактная сетка, рамки вместо заливок, цифры моноширинным шрифтом. Под руководителей и HR, которые держат кабинет открытым весь день.</li>
  </ul>
  <p>Содержание экранов во всех вариантах одинаковое, выбор только про подачу. Ссылку на конкретный вариант можно отправить: <code>?design=b&amp;theme=dark</code> в адресе открывает вариант Б в тёмной теме.</p>

  <h2>Что изменилось по вкладке «3.0. Задача»</h2>
  <ol>
    <li><b>Формат представления — дашборд.</b> Первый экран каждого кабинета собирает главное: цифры, графики, что требует внимания, ближайшие события.</li>
    <li><b>HR-менеджер и директор — один кабинет.</b> Видят все отделы и дашборды, меняют карточки, грейды и шаблоны. Директор дополнительно видит PR, грейдирование и mNPS руководителей отделов: блок «Руководители отделов» на экране Performance Review.</li>
    <li><b>У каждой роли свой набор грейдов.</b> Аккаунты: Junior, Middle, Middle+, Senior. Перформанс и SEO: Junior, Junior+, Middle, Middle+, Senior. Разработка: от стажёра до Senior+. Уровни проявления в матрице подписаны грейдами роли.</li>
    <li><b>Матрица включает харды и софты.</b> Софты оцениваются баллами 1–10, харды подтверждаются заданиями и артефактами, как в матрице хардов у разработки.</li>
    <li><b>Вовлечённость на дашборде обновляется раз в год.</b> Плитка показывает годовой замер и сравнение с прошлым годом. Ежемесячный пульс остался на экране «Пульс и mNPS».</li>
    <li><b>Журнал обратной связи без автора.</b> У записи дата и источник: транскрипт, наблюдение руководителя, анкета, 360.</li>
    <li><b>Сроки:</b> 1:1 еженедельно на испытательном сроке, дальше раз в 1–2 недели, без отдельного квартального. Контрольная точка 1 PR в апреле и сентябре. LMS обновляется раз в неделю.</li>
    <li><b>Убраны</b> рекрутер и статус «отпуск» из карточки сотрудника, раскладка оценки на грейд по цветным зонам, требование к серверу.</li>
    <li><b>Схема и промт.</b> Экран «Схема и промт» показывает блок-схему трёх кабинетов: источники данных и связи окрашены, при наведении на источник подсвечиваются все экраны, куда он идёт. Ниже промт для Gamma, собранный из той же схемы.</li>
  </ol>

<h2>1. Цель</h2>
<p>Собрать HR-артефакты, которые сейчас живут в отдельных таблицах и записях встреч, в один интерфейс с удобным форматом представления.</p>
<p>Три вида кабинетов с разными уровнями доступа:</p>
<ul><li>сотрудник</li><li>руководителя отдела</li><li>HR-менеджер и директора</li></ul>
<p>Формат представления - Дашборд.</p>
<p>Процессы для всех отделов одинаковы, отличаются только матрицы компетенций и метрики Performance Review по ролям.</p>
<h2>2. Роли и видимость</h2>
<p><b>Сотрудник.</b> Видит: Только себя: профиль, задачи, LMS, PR, 360 в агрегате, ИПР, постмиты 1:1, журнал обратной связи о себе. Меняет: Свою часть постмита, самооценку по матрице, Self Review, ИПР, анкеты.</p>
<p><b>Руководитель отдела.</b> Видит: Только свой отдел: профили, задачи, постмиты, PR, 360 по группам респондентов, ИПР, адаптация, транскрипты своих встреч, журнал обратной связи. Меняет: Валидация постмитов и матриц, подтверждение задач и обратной связи из транскриптов, лист PR, план адаптации, карточки сотрудников своего отдела.</p>
<p>Приватные заметки руководителя видит только руководитель, они не попадают в экспорт и отчёты. На текущем этапе оценки к зарплате не привязаны и в кабинете суммы оклада не показываются.</p>
<p><b>HR-менеджер и директор.</b> Видит: Все отделы, дашборды. Меняет: Карточки сотрудников, грейды, руководители, наставники; шаблоны матриц, цикла PR, 360, адаптации, опросов.</p>
<h2>3. Сущности</h2>
<ul><li><b>Сотрудник</b>: ФИО, роль, отдел, руководитель, наставник, дата выхода, статус (испытательный срок, в штате, уволен), текущий грейд, история грейдов с датами и основаниями.</li><li><b>Отдел</b>: название, руководитель, трек (матрица компетенций и набор метрик PR).</li></ul>
<ul><li><b>Матрица компетенций трека</b>: компетенции, сгруппированные по блокам; каждая роль имеет свое количество блоков (junior, junior+, middel и т.д.)? шкала 1–10; диапазоны суммы баллов для грейдов; ограничения перехода (минимальный балл по отдельным компетенциям); минимальные сроки между грейдами. Матрица включает харды и софты.</li><li><b>Оценка на грейд</b>: заполненная сотрудником матрица с артефактами (ссылки на задачи, кейсы), валидация руководителя, сумма баллов, проверка ограничений, решение, постмит сотрудника по итогу, план корректировки.</li><li><b>Постмит 1:1</b>: дата, тема, вопросы руководителя, вопросы сотрудника, действия (что договорились делать), сроки, задачи и артефакты; самочувствие по желанию; транскрипт, если встреча записана.</li><li><b>Задача</b>: оперативная (из постмита или транскрипта, срок 1–2 недели) или длительная (цель PR на полугодие, шаг ИПР на квартал); источник, срок, статус, результат или прогресс.</li><li><b>Performance Review</b>: период (полугодие), дата встречи и участники, грейд, метрики эффективности по роли (план, контрольная точка 1, контрольная точка 2, факт), цели на развитие (формулировка, критерии достижения, ссылка на задачу, итог), 360 на начало и конец периода (сильные стороны, зоны роста), итоговый уровень A / B / C / D на каждой точке, прямая речь, шаги изменений.</li><li><b>Self Review</b>: ответы сотрудника на вопросы по блокам (цели, метрики, 360, динамика развития, командная работа) перед PR.</li><li><b>Оценка 360</b>: период, респонденты (самооценка, руководитель, коллеги), компетенции с индикаторами, шкала 1–5 и «0 — не наблюдал», комментарии к оценкам, два открытых вопроса, итог: оценка окружения и средняя по каждому индикатору.</li><li><b>mNPS</b>: оценка руководителя подчинёнными по блокам (вовлечение и лидерство, постановка задач, контроль и нагрузка, коммуникации, обучение и развитие, улучшение процессов, решение сложных ситуаций), индекс mNPS, прямая речь.</li><li><b>ИПР</b>: период (квартал), одна цель (компетенция), причина, тайминг, поднавыки с оценкой «сейчас → план» по 10-балльной шкале и расшифровкой, план по навыкам (проекты и задачи, эксперты, информация, метрики, контрольные точки 1 и 2), подведение итогов.</li><li><b>Онбординг</b>: даты ИС, рекрутер, наставник, HR BP, план адаптации в LMS, цели и критерии прохождения ИС, встречи (установочная, неделя, экватор, финиш, встреча с HR BP на 5-й месяц) с участниками и постмитами, совместная оценка погружения по шкале 1–4 (сотрудник и руководитель), риск.</li><li><b>Курс LMS</b>: название, тип (обязательный, развивающий), срок, статус (назначен, просрочен, пройден). Приходит из LMS по API.</li><li><b>Транскрипт встречи</b>: дата, название, участники, текст, извлечённые пункты (задача или обратная связь, сотрудник, текст, срок, тип «молодец / зона роста»), статус пункта (ждёт решения, подтверждён, отклонён), кто и когда решил.</li><li><b>Запись обратной связи</b>: дата, кому, от кого, тип (молодец / зона роста), текст, источник (транскрипт, наблюдение руководителя, анкета, 360), квартал.</li><li><b>Пульс-опрос</b>: месяц, вопросы, вовлечённость по отделам, eNPS, отклик, действия по итогам.</li><li><b>Шаблоны</b> (ведёт HR): матрицы по трекам, метрики PR по ролям, цикл PR, анкеты 360 и mNPS, план адаптации, вопросы пульс-опроса, формат постмита.</li><li><b>Журнал изменений</b>: кто, когда и что изменил в карточках, грейдах и шаблонах.</li></ul>
<h2>4. Кабинет сотрудника</h2>
<p>Экраны:</p>
<ol><li><b>Профиль.</b> Грейд, стаж, руководитель, сумма баллов по матрице, уровень на последней точке PR. Оперативные задачи из постмитов, длительные задачи с прогрессом, карточка PR (уровень, сильные стороны и зоны роста из 360), радар по группам компетенций с зонами роста, назначенные курсы LMS, последние записи обратной связи о себе, последний постмит, история грейдов.</li><li><b>Задачи.</b> Оперативные (из постмитов 1:1 и подтверждённых транскриптов) и длительные (цели PR, шаги ИПР), статусы, результаты, прогресс.</li><li><b>Постмиты 1:1.</b> Следующая встреча с вопросами обеих сторон; прошедшие встречи в формате постмита; подсказка, с чем можно прийти на 1:1. Сотрудник заполняет свою часть, руководитель дополняет и валидирует.</li><li><b>Обучение (LMS).</b> Назначенные, просроченные и пройденные курсы; данные из LMS.</li><li><b>Performance Review.</b> Текущий цикл целиком (метрики, цели, 360 в цикле, уровни по точкам, прямая речь, шаги), отчёт 360 в агрегате (самооценка, оценка окружения, средняя, разрывы, комментарии обезличенно, открытые вопросы), прошлые циклы, ссылка на Self Review.</li><li><b>Матрица грейдов и план.</b> Текущий и следующий грейд, баллы и диапазоны, ограничения перехода с текущими значениями, минимальные сроки, плановая дата оценки, чек-лист «проверь себя», матрица с уровнями проявления, подсвеченными по текущему баллу, вопросы постмита после оценки.</li><li><b>ИПР.</b> Цель на квартал, причина и тайминг, поднавыки «сейчас → план», план по навыкам с контрольными точками, прогресс и дата чекина.</li><li><b>Анкеты и самооценка.</b> Самооценка по матрице с артефактами (отправляется руководителю на валидацию), анкета 360 о коллеге (анонимно), Self Review перед PR.</li></ol>
<p>Обязательно видны на первом экране: грейд, оперативные задачи из 1:1, длительные задачи из PR и ИПР, зоны роста по матрице.</p>
<h2>5. Кабинет руководителя отдела</h2>
<p>Экраны, все в границах своего отдела:</p>

<h2>Короткий промт</h2>
<p>Если Gamma режет длинный текст.</p>
<pre>Блок-схема HR-кабинета агентства, 16:9, белый фон, скруглённые блоки, слева направо: «Источники данных» → «Кабинет сотрудника» (видит только себя) → «Кабинет руководителя отдела» (свой отдел) → «Кабинет HR-менеджера и директора» (все отделы). У каждого источника свой цвет: <span class="src" style="color:var(--src-staff)">Кадровые данные</span> #475569, <span class="src" style="color:var(--src-postmit)">Постмиты 1:1</span> #0E7490, <span class="src" style="color:var(--src-transcripts)">Транскрипты встреч</span> #1D4ED8, <span class="src" style="color:var(--src-lms)">LMS iSpring Learn</span> #15803D, <span class="src" style="color:var(--src-matrix)">Матрица и оценка на грейд</span> #7C3AED, <span class="src" style="color:var(--src-pr)">Performance Review и ИПР</span> #C2410C, <span class="src" style="color:var(--src-surveys)">Анкеты и опросы</span> #BE185D, <span class="src" style="color:var(--src-feedback)">Журнал обратной связи</span> #A16207, <span class="src" style="color:var(--src-onboarding)">План адаптации</span> #B91C1C, <span class="src" style="color:var(--src-templates)">Шаблоны HR</span> #6B7280. Источник, его упоминания в кабинетах и стрелки к ним — одного цвета. Транскрипты идут в кабинеты только через блок «Подтверждение руководителем». Экраны кабинетов: сотрудник — Профиль, Задачи, Постмиты 1:1, Обучение (LMS), Performance Review, Матрица грейдов и план, ИПР, Анкеты и самооценка; руководитель отдела — Дашборд отдела, Структура, Сотрудники, Профиль подчинённого, Транскрипты встреч, Обратная связь, Performance Review, Адаптация и обучение, Пульс и mNPS, Карта процессов; HR и директор — Все экраны руководителя, Данные сотрудников, Шаблоны и циклы, Роли и доступ, Руководители отделов. Внизу легенда цветов.</pre>
<h2>Как проверить схему</h2>
<ul><li>Три кабинета подписаны областью видимости: «только себя», «свой отдел», «все отделы».</li><li>В левой колонке 10 источников, у каждого свой цвет, и тот же цвет у его упоминаний в кабинетах.</li><li>От каждого источника к каждому кабинету, который он питает, идёт стрелка его цвета.</li><li>Транскрипты попадают в кабинеты только через «Подтверждение руководителем».</li><li>Нет блоков найма и зарплаты.</li></ul>
