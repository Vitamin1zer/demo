  <div class="notice">Это каркас для обсуждения, не рабочая система: все люди, цифры и события вымышлены. Структура экранов повторяет артефакты, которые уже есть в агентстве: личный кабинет сотрудника в таблице (онбординг, постмиты 1:1, матрица грейдов, Performance Review, Self Review, оценка 360, mNPS, ИПР, грейдирование) и журнал обратной связи «Молодец / Не молодец» по кварталам.</div>

  <h2>Что изменилось во второй версии</h2>
  <ol>
    <li><b>Три роли вместо двух.</b> Сотрудник видит только себя. Руководитель отдела видит свой отдел. HR-менеджер и директор видят все отделы, HR заводит и меняет данные сотрудников, шаблоны и циклы.</li>
    <li><b>Матрица грейдов как у заказчика.</b> Для аккаунтов 14 компетенций по 10 баллов (максимум 140), четыре уровня проявления, диапазоны баллов и ограничения для перехода на Middle, Middle+ и Senior. Для других треков матрицы короче, шаблоны у заказчика есть.</li>
    <li><b>Performance Review раз в полугодие с двумя контрольными точками.</b> Метрики эффективности по роли (план → точка 1 → точка 2 → факт), цели на развитие с критериями и ссылками на Планфикс, 360 на начало и конец периода, итоговый уровень A / B / C / D, прямая речь и шаги изменений. К зарплате не привязан.</li>
    <li><b>Оценка 360 по индикаторам.</b> Компетенции с индикаторами, шкала 1–5, итоги показываются в агрегате: самооценка, оценка окружения, средняя. Комментарии обезличены. Отдельно mNPS: как подчинённые оценивают руководителя.</li>
    <li><b>Транскрипты встреч → задачи и обратная связь.</b> Из загруженного транскрипта извлекаются задачи для сотрудников и обратная связь по ним; руководитель подтверждает или отклоняет, после чего они появляются в кабинете сотрудника и в журнале обратной связи (пункт 15 ТЗ).</li>

    <li><b>LMS по API: только названия курсов и статус.</b> Назначен, просрочен, пройден. Прогресс и баллы тестов не тянем.</li>
    <li><b>Онбординг по четырём встречам.</b> Установочная, неделя, экватор, финиш: роли руководителя, рекрутера, наставника и HR BP, совместная оценка погружения 1–4, критерии прохождения ИС, встреча с HR BP на пятый месяц.</li>
    <li><b>ИПР как у заказчика.</b> Одна цель на квартал, поднавыки «сейчас → план» по 10-балльной шкале, проекты и задачи, эксперты, информация, метрики, две контрольные точки.</li>
    <li><b>Формы.</b> Самооценка по матрице с артефактами, анкета 360 о коллеге, Self Review перед PR.</li>
    <li><b>Убрано по ответам заказчика:</b> найм, метрики продуктивности, уведомления, привязка оценок к зарплате, технические рамки.</li>
  </ol>

<p>Дата: 12.10.2026. Основание: базовое ТЗ (вкладка «1.0. Задача»), ответы заказчика на 14 вопросов и пункт 15 (вкладка «2.0. Задача»), действующие артефакты агентства: личный кабинет сотрудника в таблице (онбординг, постмиты 1:1, матрица грейдов, Performance Review, Self Review, оценка 360, mNPS, ИПР, грейдирование) и журнал обратной связи по сотрудникам по кварталам. Каркас для обсуждения: <a href="https://vitamin1zer.github.io/demo/hr-cabinet/kabinet/" target="_blank" rel="noopener">https://vitamin1zer.github.io/demo/hr-cabinet/kabinet/</a></p>
<p>Технические рамки (стек, хостинг, сроки) в ТЗ не входят по решению заказчика. Единственное требование к инфраструктуре: данные хранятся на сервере в России.</p>
<h2>1. Цель</h2>
<p>Собрать HR-артефакты, которые сейчас живут в отдельных таблицах и записях встреч, в один интерфейс с тремя кабинетами: сотрудника, руководителя отдела, HR-менеджера и директора. Кабинет показывает по каждому сотруднику грейд и матрицу компетенций, задачи, обучение, итоги оценок, ИПР и обратную связь; по отделу и агентству даёт дашборды. Процессы для всех отделов одинаковы, отличаются только матрицы компетенций и метрики Performance Review по ролям.</p>
<h2>2. Роли и видимость</h2>
<table><thead><tr><th>Роль</th><th>Видит</th><th>Меняет</th></tr></thead><tbody><tr><td>Сотрудник</td><td>Только себя: профиль, задачи, LMS, PR, 360 в агрегате, ИПР, постмиты 1:1, журнал обратной связи о себе</td><td>Свою часть постмита, самооценку по матрице, Self Review, ИПР, анкеты</td></tr><tr><td>Руководитель отдела</td><td>Только свой отдел: профили, задачи, постмиты, PR, 360 по группам респондентов, ИПР, адаптация, транскрипты своих встреч, журнал обратной связи</td><td>Валидация постмитов и матриц, подтверждение задач и обратной связи из транскриптов, лист PR, план адаптации, карточки сотрудников своего отдела</td></tr><tr><td>HR-менеджер</td><td>Все отделы</td><td>Карточки сотрудников, грейды, руководители, наставники; шаблоны матриц, цикла PR, 360, адаптации, опросов</td></tr><tr><td>Директор</td><td>Все отделы, дашборды, PR всех отделов, mNPS руководителей</td><td>Решения по PR и грейдам руководителей отделов</td></tr></tbody></table>
<p>Приватные заметки руководителя видит только автор, они не попадают в экспорт и отчёты. Оценки к зарплате не привязаны и в кабинете суммы оклада не показываются.</p>
<h2>3. Сущности</h2>
<ul><li><b>Сотрудник</b>: ФИО, роль, отдел, руководитель, наставник, рекрутер, дата выхода, статус (испытательный срок, в штате, отпуск, уволен), текущий грейд, история грейдов с датами и основаниями.</li><li><b>Отдел</b>: название, руководитель, трек (матрица компетенций и набор метрик PR).</li><li><b>Матрица компетенций трека</b>: компетенции, сгруппированные по блокам; для каждой четыре уровня проявления с описанием (базовый, средний, продвинутый, эксперт); шкала 1–10; диапазоны суммы баллов для грейдов; ограничения перехода (минимальный балл по отдельным компетенциям); минимальные сроки между грейдами. Для разработки: матрица хардов (знание, навык, тип задания, где изучить, срок, статус, способ проверки, артефакты, контроль «подтверждено / не подтверждено») и матрица софтов (поведенческие характеристики, самооценка, валидация).</li><li><b>Оценка на грейд</b>: заполненная сотрудником матрица с артефактами (ссылки на задачи, кейсы), валидация руководителя, сумма баллов, проверка ограничений, решение, постмит сотрудника по итогу (зелёная, жёлтая, красная зоны, план корректировки).</li><li><b>Постмит 1:1</b>: дата, тема, вопросы руководителя, вопросы сотрудника, действия (что договорились делать), сроки, задачи и артефакты; самочувствие по желанию; транскрипт, если встреча записана.</li><li><b>Задача</b>: оперативная (из постмита или транскрипта, срок 1–2 недели) или длительная (цель PR на полугодие, шаг ИПР на квартал); источник, срок, статус, результат или прогресс.</li><li><b>Performance Review</b>: период (полугодие), дата встречи и участники, грейд, метрики эффективности по роли (план, контрольная точка 1, контрольная точка 2, факт), цели на развитие (формулировка, критерии достижения, ссылка на задачу, итог), 360 на начало и конец периода (сильные стороны, зоны роста), итоговый уровень A / B / C / D на каждой точке, прямая речь, шаги изменений.</li><li><b>Self Review</b>: ответы сотрудника на вопросы по блокам (цели, метрики, 360, динамика развития, командная работа) перед PR.</li><li><b>Оценка 360</b>: период, респонденты (самооценка, руководитель, коллеги), компетенции с индикаторами, шкала 1–5 и «0 — не наблюдал», комментарии к оценкам, два открытых вопроса, итог: оценка окружения и средняя по каждому индикатору.</li><li><b>mNPS</b>: оценка руководителя подчинёнными по блокам (вовлечение и лидерство, постановка задач, контроль и нагрузка, коммуникации, обучение и развитие, улучшение процессов, решение сложных ситуаций), индекс mNPS, прямая речь.</li><li><b>ИПР</b>: период (квартал), одна цель (компетенция), причина, тайминг, поднавыки с оценкой «сейчас → план» по 10-балльной шкале и расшифровкой, план по навыкам (проекты и задачи, эксперты, информация, метрики, контрольные точки 1 и 2), подведение итогов.</li><li><b>Онбординг</b>: даты ИС, рекрутер, наставник, HR BP, план адаптации в LMS, цели и критерии прохождения ИС, встречи (установочная, неделя, экватор, финиш, встреча с HR BP на 5-й месяц) с участниками и постмитами, совместная оценка погружения по шкале 1–4 (сотрудник и руководитель), риск.</li><li><b>Курс LMS</b>: название, тип (обязательный, развивающий), срок, статус (назначен, просрочен, пройден). Приходит из LMS по API.</li><li><b>Транскрипт встречи</b>: дата, название, участники, текст, извлечённые пункты (задача или обратная связь, сотрудник, текст, срок, тип «молодец / зона роста»), статус пункта (ждёт решения, подтверждён, отклонён), кто и когда решил.</li><li><b>Запись обратной связи</b>: дата, кому, от кого, тип (молодец / зона роста), текст, источник (транскрипт, наблюдение руководителя, анкета, 360), квартал.</li><li><b>Пульс-опрос</b>: месяц, вопросы, вовлечённость по отделам, eNPS, отклик, действия по итогам.</li><li><b>Шаблоны</b> (ведёт HR): матрицы по трекам, метрики PR по ролям, цикл PR, анкеты 360 и mNPS, план адаптации, вопросы пульс-опроса, формат постмита.</li><li><b>Журнал изменений</b>: кто, когда и что изменил в карточках, грейдах и шаблонах.</li></ul>
<h2>4. Кабинет сотрудника</h2>
<p>Экраны:</p>
<ol><li><b>Профиль.</b> Грейд, стаж, руководитель, сумма баллов по матрице, уровень на последней точке PR. Оперативные задачи из постмитов, длительные задачи с прогрессом, карточка PR (уровень, сильные стороны и зоны роста из 360), радар по группам компетенций с зонами роста, назначенные курсы LMS, последние записи обратной связи о себе, последний постмит, история грейдов.</li><li><b>Задачи.</b> Оперативные (из постмитов 1:1 и подтверждённых транскриптов) и длительные (цели PR, шаги ИПР), статусы, результаты, прогресс.</li><li><b>Постмиты 1:1.</b> Следующая встреча с вопросами обеих сторон; прошедшие встречи в формате постмита; подсказка, с чем можно прийти на 1:1. Сотрудник заполняет свою часть, руководитель дополняет и валидирует.</li><li><b>Обучение (LMS).</b> Назначенные, просроченные и пройденные курсы; данные из LMS.</li><li><b>Performance Review.</b> Текущий цикл целиком (метрики, цели, 360 в цикле, уровни по точкам, прямая речь, шаги), отчёт 360 в агрегате (самооценка, оценка окружения, средняя, разрывы, комментарии обезличенно, открытые вопросы), прошлые циклы, ссылка на Self Review.</li><li><b>Матрица грейдов и план.</b> Текущий и следующий грейд, баллы и диапазоны, ограничения перехода с текущими значениями, минимальные сроки, плановая дата оценки, чек-лист «проверь себя», матрица с уровнями проявления, подсвеченными по текущему баллу, вопросы постмита после оценки.</li><li><b>ИПР.</b> Цель на квартал, причина и тайминг, поднавыки «сейчас → план», план по навыкам с контрольными точками, прогресс и дата чекина.</li><li><b>Анкеты и самооценка.</b> Самооценка по матрице с артефактами (отправляется руководителю на валидацию), анкета 360 о коллеге (анонимно), Self Review перед PR.</li></ol>

<h2>5. Кабинет руководителя отдела</h2>
<p>Экраны, все в границах своего отдела:</p>
<ol><li><b>Дашборд отдела.</b> Сотрудников, на ИС и с риском, пунктов из транскриптов ждут подтверждения, обратная связь за 30 дней, просроченные задачи и обязательные курсы, доля 1:1 за две недели, вовлечённость отдела; распределение по грейдам, итоги PR по уровням A–D, вовлечённость по месяцам; список «требует внимания» со ссылками; ближайшие события (встречи ИС, контрольные точки PR, чекины ИПР).</li><li><b>Структура.</b> Оргсхема агентства, свой отдел активен, остальные показаны без доступа; роли в системе; треки и грейды; сводка по отделам.</li><li><b>Сотрудники.</b> Таблица с фильтром по статусу: грейд, баллы по матрице, стаж, уровень PR, зоны роста. Переход в профиль.</li><li><b>Профиль подчинённого.</b> Вкладки: обзор (радар, сильные навыки и зоны роста, пункты из транскриптов, ждущие решения, история грейдов, карточка ИС, приватная заметка), матрица грейдов с ограничениями, задачи, постмиты 1:1, Performance Review (лист целиком, с правом заполнять), оценка 360 по группам респондентов, ИПР, LMS, обратная связь «молодец / не молодец».</li><li><b>Транскрипты встреч.</b> Список транскриптов встреч руководителя с числом пунктов, ждущих решения; текст транскрипта с подсветкой; извлечённые задачи и обратная связь по сотрудникам с кнопками «подтвердить» и «отклонить». Подтверждённая задача попадает в задачи и постмит сотрудника, подтверждённая обратная связь в журнал и профиль. Без подтверждения ничего не записывается.</li><li><b>Обратная связь.</b> Форма фиксации (кому, тип, источник, квартал, текст), счётчик пунктов из транскриптов, журнал по кварталам: по каждому сотруднику две колонки «Молодец» и «Не молодец» с датой, автором и источником записи.</li><li><b>Performance Review.</b> Текущий цикл и его точки, итоги прошлого цикла по сотрудникам отдела с уровнями и решениями, схема цикла, расшифровка уровней.</li><li><b>Адаптация и обучение.</b> Новички отдела: встречи онбординга с датами и постмитами, совместная оценка погружения, цели и критерии ИС, риск; обязательные и развивающие курсы по сотрудникам со статусами из LMS.</li><li><b>Пульс и mNPS.</b> eNPS агентства, вовлечённость отдела по месяцам рядом со средним по агентству, вопросы опроса, mNPS руководителя по себе, действия по итогам опроса.</li><li><b>Карта процессов.</b> Три блока процессов, календарь цикла на год, источники данных для каждого блока.</li></ol>
<h2>6. Кабинет HR-менеджера и директора</h2>
<p>Те же экраны, что у руководителя, но по всем отделам, плюс:</p>
<ol><li><b>Данные сотрудников.</b> Создание карточки (создаёт кабинет сотрудника, план адаптации из шаблона, назначение обязательных курсов), изменение отдела, руководителя, наставника, грейда с датой и основанием, статуса, плановых дат PR и оценки на грейд; журнал изменений.</li><li><b>Шаблоны и циклы.</b> Матрицы компетенций по трекам с диапазонами и ограничениями, метрики PR по ролям, расписание цикла PR, анкеты 360 и mNPS, план адаптации с ролями и шкалой, формат постмита, вопросы пульс-опроса, параметры интеграции с LMS.</li><li><b>Роли и доступ.</b> Матрица видимости данных по ролям.</li></ol>
<p>Директор дополнительно видит PR, грейдирование и mNPS руководителей отделов.</p>
<h2>7. Процессы</h2>
<p><b>Онбординг.</b> Установочная встреча в первый день: цели и критерии ИС, план адаптации в LMS, наставник, порядок задач. Через неделю: техника и сервисы (блок рекрутера), оценка погружения, актуализация задач до экватора. Экватор: оценка погружения 1–4 по параметрам (команда, роли, коммуникация, продукт, бизнес-процессы, инструменты, боевые задачи), актуализация критериев ИС. Финиш: 360 от команды, прогресс по критериям, решение по ИС, зоны роста и метрики к ним. На пятый месяц встреча с HR BP. Риск по новичку считается по просроченным встречам и курсам и по оценкам погружения ниже 3.</p>
<p><b>1:1.</b> Еженедельно на ИС, далее раз в 1–2 недели; раз в квартал итоговый 1:1. Постмит заполняет сотрудник, руководитель дополняет и валидирует. Блок «Действия» рождает оперативные задачи. Если встреча записана, транскрипт проходит процедуру извлечения и подтверждения.</p>
<p><b>Performance Review.</b> Раз в полугодие: постановка целей (февраль, август), контрольная точка 1 (апрель–май, сентябрь), контрольная точка 2 (июнь, декабрь), итоги (июль, январь). Входы: метрики по роли, цели на развитие, 360 на начало и конец периода, Self Review. Итог: уровень A–D, прямая речь, шаги изменений. К зарплате не привязан.</p>
<p><b>Оценка 360.</b> Перед итоговым PR и на контрольных точках. Респонденты: самооценка, руководитель, коллеги. Итоги показываются в агрегате; комментарии обезличены.</p>
<p><b>Грейдирование.</b> После PR с уровнем не ниже B и не раньше минимального срока на текущем грейде. Сотрудник заполняет матрицу с артефактами, руководитель валидирует, система считает сумму и проверяет ограничения. Решение фиксируется в истории грейдов, сотрудник пишет постмит по итогу и ставит цель ИПР.</p>
<p><b>ИПР.</b> Одна компетенция на квартал. Компетенция выбирается там, где зона роста повторяется в разных источниках: 360, оценка на грейд, PR, обратная связь руководителя и клиентов. Ежемесячный чекин на 1:1, итоги в конце квартала.</p>
<p><b>Транскрипты и обратная связь (пункт 15 ТЗ).</b> Если в транскрипте встречи упомянута задача для сотрудника или обратная связь по сотруднику, система извлекает её как пункт с привязкой к сотруднику. Руководитель подтверждает, правит или отклоняет. Подтверждённая запись появляется в кабинете руководителя по этому сотруднику (профиль, журнал обратной связи) и в кабинете сотрудника (задачи, постмит, обратная связь о себе). Пример: Вася дал обратную связь по Пете на синхроне; после подтверждения руководителем запись видна в карточке Пети.</p>
<p><b>Пульс-опросы и mNPS.</b> Раз в месяц, анонимно; результаты по отделам и агентству; за действия по итогам отвечает руководитель отдела. mNPS раз в полугодие.</p>
<h2>8. Интеграции и данные</h2>
<ul><li><b>LMS (iSpring Learn)</b>: по API раз в сутки назначенные курсы сотрудника: название, срок, статус (назначен, просрочен, пройден). Прогресс и баллы тестов не передаются.</li><li><b>Транскрипты</b>: загрузка текста или файла руководителем, либо автоматическая передача из сервиса записи (формат уточняется). Извлечение задач и обратной связи автоматическое, подтверждение ручное.</li><li><b>Трекер задач</b>: не подключается; ссылки на задачи в Планфиксе хранятся как текст в постмитах и целях PR.</li><li><b>Кадровые данные</b>: вводит HR-менеджер или руководитель, внешняя система не подключается; история изменений обязательна.</li><li><b>Хранение</b>: сервер в России; согласия сотрудников и сроки хранения оценок и заметок определяет заказчик.</li></ul>
<h2>9. Не входит в версию 2.0</h2>
<p>Найм (воронка кандидатов, интеграция с ATS), метрики продуктивности агентства, уведомления в мессенджеры и почту, привязка оценок к окладу и бонусам, мобильное приложение, технические рамки реализации.</p>
