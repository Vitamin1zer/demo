<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Демонстрационные материалы</title>
<style>
  :root { --bg: #f6f5f8; --fg: #1c1a21; --muted: #6d6875; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b0a0e; --fg: #e4e2e8; --muted: #918b9a; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--fg);
         font: 500 16px/1.5 system-ui, "Segoe UI", sans-serif; padding: 24px; box-sizing: border-box; }
  main { max-width: 520px; text-align: center; }
  h1 { font-size: 22px; margin: 0 0 8px; }
  p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Демонстрационные материалы</h1>
  <p>Здесь лежат материалы, подготовленные для показа. Ссылку на нужный материал вам прислали отдельно.</p>
</main>
</body>
</html>
